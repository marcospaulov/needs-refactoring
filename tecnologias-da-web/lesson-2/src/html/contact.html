<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/contact.css" />
        <script src="../components/header-footer.js" defer></script>
        <title>contato</title>
    </head>
    <body>
        <header id="header"></header>

        <main>
            <div class="container">
                <form action="">
                    <h1>Contato</h1>

                    <label for="">
                        <input placeholder="Seu nome" type="text" name="name" id="name" spellcheck="false" />
                    </label>

                    <label for="">
                        <input placeholder="Seu E-mail" type="email" name="email" id="email" spellcheck="false" />
                    </label>
                    <label for="">
                        <textarea placeholder="Insira o texto" name="" spellcheck="false" id="" cols="30" rows="10"></textarea>
                    </label>
                    <button>Enviar</button>
                </form>
            </div>
        </main>

        <footer id="footer"></footer>
        <script></script>
    </body>
</html>
